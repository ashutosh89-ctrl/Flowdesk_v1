<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="flowTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E4E4E7" />
    </linearGradient>
    <linearGradient id="flowFoldGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D4D4D8" />
      <stop offset="40%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="flowStemGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#E4E4E7" />
    </linearGradient>
  </defs>

  <!-- FlowDesk Monogram Mark (Stylized Modern Ribbon F) -->
  <g transform="translate(10, 8)">
    <!-- Upper Flow & Top Loop -->
    <path
      d="M 52 14 C 76 14, 126 14, 134 14 C 141 14, 145 22, 137 32 C 122 50, 96 68, 62 68 C 42 68, 32 58, 32 40 C 32 24, 40 14, 52 14 Z"
      fill="url(#flowTopGrad)"
    />

    <!-- Middle Horizontal Ribbon Bar -->
    <path
      d="M 28 80 C 44 64, 76 64, 116 64 C 125 64, 128 72, 121 82 C 108 97, 85 110, 52 110 C 36 110, 24 100, 28 80 Z"
      fill="url(#flowFoldGrad)"
    />

    <!-- Lower Dynamic Stem / Tail -->
    <path
      d="M 32 44 C 32 68, 31 92, 14 116 C 5 129, 6 138, 17 142 C 28 146, 38 138, 45 125 C 56 104, 58 78, 58 48 C 58 38, 52 38, 42 40 Z"
      fill="url(#flowStemGrad)"
    />
  </g>
</svg>
